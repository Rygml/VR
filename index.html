<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL PA#1 — Stereo Anaglyph</title>

    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Consolas', 'Courier New', monospace;
    background-color: #0a0a0a;
    color: #E0E0E0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    min-height: 100vh;
    gap: 16px;
}

h1 {
    color: #00FF99;
    font-size: 2.2em;
    text-shadow: 0 0 6px #00FF99, 0 0 14px rgba(0,255,153,.45);
    letter-spacing: 2px;
    margin-top: 10px;
}

#message {
    text-align: center;
    color: #99FFFF;
    font-size: 1.05em;
    line-height: 1.6;
    background: #161616;
    padding: 8px 20px;
    border-radius: 4px;
    border-left: 3px solid #00FFFF;
}

#canvas-holder {
    border: 1px solid #00FFFF;
    box-shadow: 0 0 18px rgba(0,255,255,.35), 0 0 40px rgba(0,255,153,.08);
    border-radius: 4px;
    overflow: hidden;
    background: #000;
}

#webglcanvas { display: block; }

/* ── Controls panel ─────────────────────────────────────────────────── */
.controls {
    background: #161616;
    border-radius: 6px;
    border: 1px solid #1e1e1e;
    border-left: 3px solid #00FF99;
    padding: 16px 22px;
    width: 620px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.controls-title {
    color: #00FF99;
    font-size: 0.8em;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.control-row {
    display: grid;
    grid-template-columns: 180px 1fr 56px;
    align-items: center;
    gap: 10px;
}

.control-row label {
    color: #99FFFF;
    font-size: 0.9em;
}

.control-row input[type="range"] {
    width: 100%;
    accent-color: #00FF99;
    cursor: pointer;
}

.control-row .val {
    color: #00FF99;
    font-size: 0.9em;
    text-align: right;
    min-width: 48px;
}

/* ── Camera status ──────────────────────────────────────────────────── */
#camStatus {
    font-size: 0.82em;
    color: #888;
    margin-top: 2px;
}

.hint {
    font-size: 0.78em;
    color: #555;
    text-align: center;
    margin-top: 2px;
}
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./main.js"></script>
</head>

<body onload="init()">

    <h1>WebGL PA#1</h1>

    <p id="message">
        Variant 20 &nbsp;|&nbsp; Neovious' Surface &nbsp;|&nbsp; Anaglyph Stereo
    </p>

    <div id="canvas-holder">
        <canvas width="600" height="600" id="webglcanvas"></canvas>
    </div>

    <!-- ── Stereo parameter controls ───────────────────────────────────── -->
    <div class="controls">
        <div class="controls-title">Stereo Camera Parameters</div>

        <div class="control-row">
            <label>Eye Separation</label>
            <input type="range" id="eyeSep" min="0" max="2" step="0.01" value="0.5">
            <span class="val" id="eyeSepVal">0.50</span>
        </div>

        <div class="control-row">
            <label>Convergence</label>
            <input type="range" id="convergence" min="1" max="19" step="0.1" value="10">
            <span class="val" id="convergenceVal">10.0</span>
        </div>

        <div class="control-row">
            <label>Field of View</label>
            <input type="range" id="fov" min="10" max="90" step="1" value="45">
            <span class="val" id="fovVal">45°</span>
        </div>

        <div class="control-row">
            <label>Near Clipping</label>
            <!-- max = 9.5 to stay in front of scene center (z = –10) -->
            <input type="range" id="nearClip" min="1" max="9.5" step="0.1" value="8">
            <span class="val" id="nearClipVal">8.0</span>
        </div>

        <span id="camStatus">🎥 Camera: initializing…</span>
    </div>

    <p class="hint">Drag to rotate &nbsp;·&nbsp; Use red-cyan anaglyph glasses for stereo effect</p>

</body>
</html>
